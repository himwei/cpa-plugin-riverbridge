name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Build shared object
        run: |
          CGO_ENABLED=1 go build -buildmode=c-shared \
            -trimpath -buildvcs=false \
            -o /tmp/riverbridge.so ./cmd/riverbridge/
          ls -l /tmp/riverbridge.so
