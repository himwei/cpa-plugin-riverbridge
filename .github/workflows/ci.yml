name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  # The plugin is loaded by CLIProxyAPI on FreeBSD, so the deliverable has to be
  # a FreeBSD shared object. Building it on ubuntu yields a linux .so that CPA
  # cannot load at all -- hence the VM.
  build-freebsd:
    name: Build FreeBSD .so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build inside FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          prepare: |
            pkg install -y curl ca_root_nss
          run: |
            set -eu
            curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go1.26.10.freebsd-amd64.tar.gz
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
            export PATH=/usr/local/go/bin:$PATH
            go version

            VER=$(grep -oE 'Version[[:space:]]*=[[:space:]]*"[^"]+"' internal/bridge/types.go \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "plugin version: $VER"

            mkdir -p dist
            CGO_ENABLED=1 GOOS=freebsd GOARCH=amd64 \
              go build -buildmode=c-shared -trimpath -buildvcs=false \
              -ldflags='-s -w' -o "dist/riverbridge-$VER.so" ./cmd/riverbridge/

            ls -l dist/
            echo "sha256:"; sha256 -q "dist/riverbridge-$VER.so"

      - uses: actions/upload-artifact@v4
        with:
          name: riverbridge-freebsd-amd64
          path: dist/*.so
          if-no-files-found: error
          retention-days: 90

  # Release assets are plain HTTPS downloads, so the server can fetch them with
  # curl alone -- unlike Actions artifacts, which need an API token. Push a tag
  # (e.g. `git tag v0.3.1 && git push origin v0.3.1`) to publish.
  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-freebsd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: riverbridge-freebsd-amd64
          path: dist

      # Guard against publishing v0.3.2 that still reports Version = "0.3.1":
      # the asset filename comes from types.go, the tag comes from the ref.
      - name: Check tag matches plugin version
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          have=$(basename dist/*.so | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+)\.so/\1/')
          echo "tag=$want  built=$have"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Version \"$have\" in internal/bridge/types.go"
            exit 1
          fi

      - name: Checksums
        run: |
          cd dist
          sha256sum *.so > checksums.txt
          cat checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.so dist/checksums.txt
