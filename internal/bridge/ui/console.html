<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiverBridge</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1e222b;
  --line: #272c37;
  --text: #e6e9ef;
  --muted: #8b93a7;
  --accent: #4c8dff;
  --accent-2: #2f6fd0;
  --ok: #35c48a;
  --warn: #e0a03a;
  --err: #e05a5a;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --line: #dfe3ea;
    --text: #1a1d23;
    --muted: #6b7280;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  position: sticky; top: 0; z-index: 10;
}
header .logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #7c5cff);
  display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px;
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .sub { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
main { max-width: 1180px; margin: 0 auto; padding: 22px; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 16px;
}
.card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
.card h2 .hint { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
input[type=text], input[type=password], select {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  padding: 9px 11px;
  font-size: 13px;
  font-family: inherit;
}
input:focus, select:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }
.row { display: flex; gap: 12px; }
.row > div { flex: 1; }
button {
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 15px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}
button:hover { border-color: var(--accent-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
button.primary:hover { background: var(--accent-2); }
button.danger { color: var(--err); }
button.danger:hover { border-color: var(--err); }
button:disabled { opacity: .5; cursor: default; }
.actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.cred {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
}
.cred .top { display: flex; align-items: flex-start; gap: 8px; }
.cred .name { font-weight: 600; font-size: 14px; word-break: break-all; }
.cred .key {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px; color: var(--muted);
  background: var(--panel-2); padding: 3px 7px; border-radius: 6px;
  display: inline-block; margin-top: 6px;
}
.cred .spacer { flex: 1; }
.badge {
  font-size: 11px; padding: 2px 8px; border-radius: 20px;
  border: 1px solid var(--line); color: var(--muted);
}
.badge.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.badge.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.stat .k { font-size: 11px; color: var(--muted); }
.stat .v { font-size: 13px; font-variant-numeric: tabular-nums; }
.meta { margin-top: 10px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
.meta code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
td code, th code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.msg { font-size: 12.5px; margin-top: 12px; padding: 9px 12px; border-radius: 8px; display: none; }
.msg.show { display: block; }
.msg.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.msg.err { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
.msg.info { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.empty { color: var(--muted); font-size: 13px; padding: 22px; text-align: center; }
pre {
  background: var(--panel-2); border-radius: 8px; padding: 12px;
  font-size: 11.5px; overflow: auto; max-height: 260px; margin: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .spacer { flex: 1; }
.totals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
@media (max-width: 720px) {
  .row { flex-direction: column; }
  .totals { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<header>
  <div class="logo">R</div>
  <div>
    <h1>RiverBridge</h1>
    <div class="sub">River 推理接入 CPA · 模型前缀 <code>river-</code></div>
  </div>
  <div class="spacer"></div>
  <div class="sub" id="status">连接中…</div>
</header>

<main>
  <div class="card">
    <h2>添加 River API Key<span class="hint">在 console.river.ai/keys 创建，形如 rv_…</span></h2>
    <div class="row">
      <div style="flex:2">
        <label for="key">API Key</label>
        <input type="password" id="key" placeholder="rv_..." autocomplete="off" spellcheck="false">
      </div>
      <div style="flex:1.2">
        <label for="label">备注名（可选）</label>
        <input type="text" id="label" placeholder="例如：主号">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div>
        <label for="base">上游地址（可选）</label>
        <input type="text" id="base" placeholder="https://api.river.ai/v1">
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="addBtn">验证并添加</button>
      <div class="sub" style="color:var(--muted);font-size:12px">
        添加前会向上游验证该 key 可访问的模型
      </div>
    </div>
    <div class="msg" id="addMsg"></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <h2 style="margin:0">账号<span class="hint" id="credCount"></span></h2>
      <div class="spacer"></div>
      <button id="refreshBtn">刷新模型</button>
      <button id="reloadBtn">重新加载</button>
    </div>
    <div class="grid" id="creds"><div class="empty">加载中…</div></div>
  </div>

  <div class="card">
    <h2>Token 用量<span class="hint">来自上游响应中的 usage 字段</span></h2>
    <div class="totals" id="totals"></div>
  </div>

  <div class="card">
    <h2>模型<span class="hint" id="modelCount"></span></h2>
    <div style="overflow:auto">
      <table id="models">
        <thead><tr><th>对外模型名</th><th>上游模型</th><th>上下文</th><th>最大输出</th><th>可用账号</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <h2 style="margin:0">诊断日志</h2>
      <div class="spacer"></div>
      <button id="clearLogs">清空</button>
    </div>
    <pre id="logs">加载中…</pre>
  </div>
</main>

<div id="lock" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
     backdrop-filter:blur(3px);z-index:50;place-items:center">
  <div class="card" style="max-width:420px;margin:0">
    <h2>解锁控制台</h2>
    <p style="color:var(--muted);font-size:12.5px;margin:0 0 12px">
      这些操作走 CPA 的管理接口，需要管理密钥。若你已在本站管理后台登录并勾选「记住凭证」，
      通常会自动通过。
    </p>
    <label for="mkType">密钥类型</label>
    <select id="mkType" style="margin-bottom:10px">
      <option value="bearer">Authorization: Bearer</option>
      <option value="x-management-key">X-Management-Key</option>
    </select>
    <label for="mk">管理密钥</label>
    <input type="password" id="mk" autocomplete="off" spellcheck="false"
           onkeydown="if(event.key==='Enter')unlockConsole()">
    <label style="display:flex;align-items:center;gap:7px;margin-top:12px;cursor:pointer">
      <input type="checkbox" id="mkRemember" style="width:auto;margin:0">
      <span style="font-size:12px;color:var(--muted)">在本机记住</span>
    </label>
    <div class="actions">
      <button class="primary" onclick="unlockConsole()">解锁</button>
    </div>
    <div class="msg" id="lockMsg"></div>
  </div>
</div>

<script>
const API = "__RIVER_API_BASE__";

// The console page itself lives under /v0/resource/... which CPA serves without
// authentication, but every XHR below targets /v0/management/... which is
// guarded. Reuse the management-center login stored by CPA's own web UI so the
// operator does not have to type the key twice.
const AUTH_STORE = "riverbridge:management-auth:" + location.origin;
let manualKey = "";
let manualType = "bearer";

function readManual(persistent) {
  try {
    const raw = (persistent ? localStorage : sessionStorage).getItem(AUTH_STORE);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function readSavedLogin() {
  try {
    if (localStorage.getItem("isLoggedIn") !== "true") return null;
    let value = localStorage.getItem("cli-proxy-auth");
    if (!value) return null;
    const v2 = value.startsWith("enc::v2::");
    if (v2 || value.startsWith("enc::v1::")) {
      const bytes = Uint8Array.from(atob(value.slice(9)), (c) => c.charCodeAt(0));
      const mask = new TextEncoder().encode(v2
        ? `cli-proxy-api-webui::secure-storage|v2|${location.host}`
        : `cli-proxy-api-webui::secure-storage|${location.host}|${navigator.userAgent}`);
      value = new TextDecoder().decode(
        bytes.map((b, i) => b ^ mask[i % mask.length]));
    }
    const saved = JSON.parse(value)?.state;
    if (!saved || saved.rememberPassword !== true) return null;
    if (typeof saved.managementKey !== "string" || !saved.managementKey.trim()) return null;
    return { key: saved.managementKey.trim(), type: "bearer" };
  } catch (e) { return null; }
}

function authHeaders() {
  for (const login of [
    manualKey ? { key: manualKey, type: manualType } : null,
    readManual(false), readManual(true), readSavedLogin(),
  ]) {
    if (login && login.key) {
      return login.type === "x-management-key"
        ? { "X-Management-Key": login.key }
        : { Authorization: "Bearer " + login.key };
    }
  }
  return {};
}

function saveManualAuth(key, type, remember) {
  manualKey = key; manualType = type;
  const value = JSON.stringify({ key, type });
  try { sessionStorage.setItem(AUTH_STORE, value); } catch (e) { /* keep in memory */ }
  try {
    if (remember) localStorage.setItem(AUTH_STORE, value);
    else localStorage.removeItem(AUTH_STORE);
  } catch (e) { /* a blocked store must not stop the page */ }
}

const $ = (id) => document.getElementById(id);

function showMsg(el, text, kind) {
  el.textContent = text;
  el.className = "msg show " + (kind || "info");
  if (kind !== "err") {
    setTimeout(() => { if (el.textContent === text) el.className = "msg"; }, 6000);
  }
}

function fmtNum(n) {
  if (n === undefined || n === null) return "0";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(2) + "K";
  return String(n);
}

function fmtCost(v) {
  if (!v) return "$0.0000";
  if (v < 0.01) return "$" + v.toFixed(6);
  return "$" + v.toFixed(4);
}

function escapeHTML(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

async function call(path, options) {
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign(
    { "Content-Type": "application/json" },
    authHeaders(),
    opts.headers || {},
  );
  const res = await fetch(API + path, opts);
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  if (res.status === 401 || res.status === 403) {
    lockConsole();
    throw new Error("管理密钥无效，请先解锁");
  }
  if (!res.ok) {
    const msg = (body && (body.error || body.message)) || ("HTTP " + res.status);
    throw new Error(msg);
  }
  return body;
}

async function loadStatus() {
  try {
    const s = await call("/status");
    $("status").textContent =
      `v${s.version} · ${s.credentials} 个账号 · ${s.models} 个内置模型`;
  } catch (e) {
    $("status").textContent = "状态不可用";
  }
}

async function loadCreds() {
  const box = $("creds");
  try {
    const data = await call("/credentials");
    const list = data.credentials || [];
    $("credCount").textContent = list.length ? `（${list.length}）` : "";
    if (!list.length) {
      box.innerHTML = '<div class="empty">还没有账号，先在上方添加一个 River API Key</div>';
      return;
    }
    box.innerHTML = list.map(renderCred).join("");
  } catch (e) {
    box.innerHTML = `<div class="empty">${escapeHTML(e.message)}</div>`;
  }
}

function renderCred(c) {
  const u = c.usage || {};
  const okClass = c.disabled ? "" : "on";
  const okText = c.disabled ? "已禁用" : "已启用";
  const models = (c.models || []).slice(0, 6).map((m) => escapeHTML(m.id)).join("、");
  const more = (c.models || []).length > 6 ? ` 等 ${c.models.length} 个` : "";
  return `
  <div class="cred">
    <div class="top">
      <div style="min-width:0">
        <div class="name">${escapeHTML(c.label || c.id)}</div>
        <div class="key">${escapeHTML(c.api_key_masked || "")}</div>
      </div>
      <div class="spacer"></div>
      <span class="badge ${okClass}">${okText}</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">输入</div><div class="v">${fmtNum(u.input_tokens)}</div></div>
      <div class="stat"><div class="k">输出</div><div class="v">${fmtNum(u.output_tokens)}</div></div>
      <div class="stat"><div class="k">缓存</div><div class="v">${fmtNum(u.cached_tokens)}</div></div>
    </div>
    <div class="stats" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat"><div class="k">请求 / 失败</div><div class="v">${fmtNum(u.requests)} / ${fmtNum(u.failures)}</div></div>
      <div class="stat"><div class="k">累计成本</div><div class="v">${fmtCost(u.cost_usd)}</div></div>
    </div>
    <div class="meta">
      <span>模型：${escapeHTML(models)}${more}</span>
    </div>
    <div class="meta">
      <span>ID <code>${escapeHTML(c.id)}</code></span>
      ${c.updated_at ? `<span>更新 ${escapeHTML(c.updated_at.replace("T", " ").slice(0, 19))}</span>` : ""}
    </div>
    ${u.last_error ? `<div class="meta"><span style="color:var(--err)">最近错误：${escapeHTML(u.last_error)}</span></div>` : ""}
    <div class="actions">
      <button data-act="test" data-id="${escapeHTML(c.id)}">测试</button>
      <button data-act="refresh" data-id="${escapeHTML(c.id)}">刷新模型</button>
      <button class="danger" data-act="delete" data-id="${escapeHTML(c.id)}">删除</button>
    </div>
  </div>`;
}

async function loadModels() {
  try {
    const data = await call("/models");
    const list = data.models || [];
    $("modelCount").textContent = list.length ? `（${list.length}）` : "";
    const tbody = $("models").querySelector("tbody");
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">还没有可用模型</td></tr>';
      return;
    }
    tbody.innerHTML = list.map((m) => `
      <tr>
        <td><code>${escapeHTML(m.id)}</code></td>
        <td><code>${escapeHTML(m.upstream)}</code></td>
        <td>${m.context_length ? fmtNum(m.context_length) : "—"}</td>
        <td>${m.max_output_tokens ? fmtNum(m.max_output_tokens) : "—"}</td>
        <td>${fmtNum((m.credentials || []).length)}</td>
      </tr>`).join("");
  } catch (e) {
    $("models").querySelector("tbody").innerHTML =
      `<tr><td colspan="5" class="empty">${escapeHTML(e.message)}</td></tr>`;
  }
}

async function loadUsage() {
  try {
    const data = await call("/usage");
    const t = data.totals || {};
    $("totals").innerHTML = `
      <div class="stat"><div class="k">请求</div><div class="v">${fmtNum(t.requests)}</div></div>
      <div class="stat"><div class="k">输入</div><div class="v">${fmtNum(t.input_tokens)}</div></div>
      <div class="stat"><div class="k">缓存</div><div class="v">${fmtNum(t.cached_tokens)}</div></div>
      <div class="stat"><div class="k">输出</div><div class="v">${fmtNum(t.output_tokens)}</div></div>
      <div class="stat"><div class="k">成本</div><div class="v">${fmtCost(t.cost_usd)}</div></div>`;
  } catch (e) { /* keep the previous totals */ }
}

async function loadLogs() {
  try {
    const data = await call("/logs");
    const logs = (data.logs || []).slice().reverse();
    if (!logs.length) { $("logs").textContent = "暂无日志"; return; }
    $("logs").textContent = logs.map((l) => {
      const parts = [l.time ? l.time.replace("T", " ").slice(0, 19) : ""];
      if (l.level) parts.push(l.level.toUpperCase());
      if (l.status) parts.push("[" + l.status + "]");
      if (l.model) parts.push(l.model);
      if (l.ms) parts.push(l.ms + "ms");
      if (l.detail) parts.push(l.detail);
      return parts.filter(Boolean).join(" ");
    }).join("\n");
  } catch (e) { $("logs").textContent = e.message; }
}

async function refreshAll() {
  await Promise.all([loadStatus(), loadCreds(), loadModels(), loadUsage(), loadLogs()]);
}

$("addBtn").addEventListener("click", async () => {
  const btn = $("addBtn");
  const key = $("key").value.trim();
  const label = $("label").value.trim();
  const base = $("base").value.trim();
  if (!key) { showMsg($("addMsg"), "请填写 API Key", "err"); return; }
  btn.disabled = true;
  showMsg($("addMsg"), "正在向上游验证…", "info");
  try {
    const res = await call("/credentials", {
      method: "POST",
      body: JSON.stringify({ api_key: key, label: label, base_url: base }),
    });
    showMsg($("addMsg"), `添加成功，发现 ${res.count} 个模型`, "ok");
    $("key").value = "";
    $("label").value = "";
    await refreshAll();
  } catch (e) {
    showMsg($("addMsg"), e.message, "err");
  } finally {
    btn.disabled = false;
  }
});

$("creds").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  btn.disabled = true;
  try {
    if (act === "delete") {
      if (!confirm("删除这个账号？对应的 auth 文件也会被移除。")) return;
      await call("/credentials?id=" + encodeURIComponent(id), { method: "DELETE" });
    } else if (act === "test") {
      const res = await call("/credentials/test", {
        method: "POST", body: JSON.stringify({ id }),
      });
      alert("验证通过，可访问 " + res.count + " 个模型");
    } else if (act === "refresh") {
      await call("/models/refresh", {
        method: "POST", body: JSON.stringify({ id }),
      });
    }
    await refreshAll();
  } catch (e) {
    alert(e.message);
  } finally {
    btn.disabled = false;
  }
});

$("refreshBtn").addEventListener("click", async () => {
  try {
    await call("/models/refresh", { method: "POST", body: "{}" });
    await refreshAll();
  } catch (e) { alert(e.message); }
});

$("reloadBtn").addEventListener("click", refreshAll);

$("clearLogs").addEventListener("click", async () => {
  try { await call("/logs/clear", { method: "POST" }); await loadLogs(); }
  catch (e) { alert(e.message); }
});

// lockConsole blocks the page until a management key is supplied.
function lockConsole() {
  const box = $("lock");
  if (box.style.display === "grid") return;
  box.style.display = "grid";
  $("mk").focus();
}

async function unlockConsole() {
  const key = $("mk").value.trim();
  if (!key) { showMsg($("lockMsg"), "请输入管理密钥", "err"); return; }
  saveManualAuth(key, $("mkType").value, $("mkRemember").checked);
  try {
    await call("/status");
  } catch (e) {
    showMsg($("lockMsg"), e.message, "err");
    return;
  }
  $("lock").style.display = "none";
  $("mk").value = "";
  await refreshAll();
}

refreshAll();
setInterval(() => { loadUsage(); loadLogs(); }, 15000);
</script>
</body>
